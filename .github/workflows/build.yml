# 自动构建 APK
#
# 作用：打一个 v 开头的版本标签推到 GitHub，就会自动编译出签好名的 release 包，
# 挂到 Releases 页面上，别人直接从那里下载安装。
#
# 怎么触发：在本机执行下面两行
#   git tag v1.0.0
#   git push origin v1.0.0
# 然后去仓库主页右侧的 Releases 看一眼，包好了会出现在最新那条下面。
#
# 前提：仓库 Settings → Secrets and variables → Actions 里要先配好四个密钥，
# 分别是 KEYSTORE_BASE64、KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD。
# 不配的话编译这一步会直接失败，不会产出装不上的未签名包。
# 生成 KEYSTORE_BASE64 的方法见 README 的「发布签名」一节。

name: 构建 APK

on:
  push:
    tags:
      - 'v*'
  # 也允许在网页上手动点按钮触发，调试用
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 建 Release 需要给 GITHUB_TOKEN 写权限，否则最后一步 403
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 自带 Android SDK（ANDROID_HOME 已配好），
      # 不再用第三方 setup-android action——它会在这一步直接失败，
      # 而且这一步挂掉之后签名、编译、发 Release 全都会被跳过。
      # 这里只用自带的 sdkmanager 补装本项目需要的组件。
      # 注意：新版 runner 上 sdkmanager 不在 PATH 里，必须写完整路径。
      - name: 装 Android SDK 组件
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      # 密钥库是从 base64 还原出来的，密码等配置写成 keystore.properties。
      # keystore.properties 放在仓库根目录（build 脚本从 rootProject 读取），
      # 但 release.jks 必须放在 app/ 目录下——因为 build.gradle.kts 里
      # storeFile = file(...) 是相对于 app 模块目录解析的。
      # 这两个文件都只存在于构建环境，不会被提交。
      - name: 还原签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，去仓库 Settings → Secrets 里配好再跑"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app/release.jks"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"
          ls -l "$GITHUB_WORKSPACE/app/release.jks"

      - name: 给 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 release 包
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 创建 Release 并挂上 APK
        uses: softprops/action-gh-release@v2
        with:
          # 编译产物就在这个目录下，直接告诉 action 去哪里找
          files: app/build/outputs/apk/release/*.apk
          # Release 标题，v1.0.0 变成「出行记 1.0.0」
          name: 出行记 ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
