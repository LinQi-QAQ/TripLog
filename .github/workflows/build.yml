# 自动构建 APK
#
# 作用：打一个 v 开头的版本标签推到 GitHub，就会自动编译出签好名的 release 包，
# 挂到 Releases 页面上，别人直接从那里下载安装。
#
# 怎么触发：在本机执行下面两行
#   git tag v1.0.0
#   git push origin v1.0.0
# 然后去仓库主页右侧的 Releases 看一眼，包好了会出现在最新那条下面。
#
# 前提：仓库 Settings → Secrets and variables → Actions 里要先配好五个密钥，
# 分别是 KEYSTORE_BASE64、KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD。
# 不配的话编译这一步会直接失败，不会产出装不上的未签名包。
# 生成 KEYSTORE_BASE64 的方法见 README 的「发布签名」一节。

name: 构建 APK

on:
  push:
    tags:
      - 'v*'
  # 也允许在网页上手动点按钮触发，调试用
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      # 密钥库是从 base64 还原出来的，密码等配置写成 keystore.properties。
      # 这个文件在 .gitignore 里，不会被提交，只存在于构建环境。
      - name: 还原签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，去仓库 Settings → Secrets 里配好再跑"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"
          ls -l "$GITHUB_WORKSPACE/release.jks"

      - name: 给 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 release 包
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 创建 Release 并挂上 APK
        uses: softprops/action-gh-release@v2
        with:
          # 编译产物就在这个目录下，直接告诉 action 去哪里找
          files: app/build/outputs/apk/release/*.apk
          # Release 标题，v1.0.0 变成「出行记 1.0.0」
          name: 出行记 ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
